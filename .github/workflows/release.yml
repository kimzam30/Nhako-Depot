name: Release

# Pushing a tag such as v0.4.0 checks the code, builds the .deb and .rpm, and publishes them on a
# GitHub Release with the notes from the metainfo.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # Ubuntu 24.04's GTK, libadwaita and glibc set the oldest systems the packages run on
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4 and libadwaita
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev appstream desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check the tag matches the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "depot"))')
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME doesn't match version $version in Cargo.toml"; exit 1; }
      - name: Check the app metadata
        run: |
          appstreamcli validate --no-net data/dev.kimzam.Depot.metainfo.xml
          desktop-file-validate data/dev.kimzam.Depot.desktop
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --locked
      - name: Check the program runs on Ubuntu 24.04's glibc (2.39) or newer
        run: |
          need=$(objdump -T target/release/depot | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "needs glibc $need"
          [ "$(printf '%s\n2.39\n' "$need" | sort -V | tail -1)" = 2.39 ]
      - name: Build the .deb and .rpm
        run: |
          cargo install --locked cargo-deb cargo-generate-rpm
          cargo deb --no-build
          cargo generate-rpm
      - name: Write the release notes
        run: |
          python3 - <<'EOF' > notes.md
          import re, xml.etree.ElementTree as ET
          release = ET.parse("data/dev.kimzam.Depot.metainfo.xml").getroot().find("releases/release")
          for li in release.iter("li"):
              print("- " + re.sub(r"\s+", " ", "".join(li.itertext())).strip())
          print()
          print("**Install:** download the `.deb` (Ubuntu 24.04, Zorin OS 18, Linux Mint 22, Debian 13 or newer) "
                "or the `.rpm` (Fedora 40 or newer) below and open it, or see the "
                "[README](https://github.com/kimzam30/Nhako-Depot#install).")
          EOF
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Depot ${GITHUB_REF_NAME#v}" --notes-file notes.md \
            target/debian/*.deb target/generate-rpm/*.rpm
