name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK 4 and libadwaita
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev appstream desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check the app metadata
        run: |
          appstreamcli validate --no-net data/dev.kimzam.Depot.metainfo.xml
          desktop-file-validate data/dev.kimzam.Depot.desktop
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release --locked
      - name: Check the licence list is up to date
        run: ./scripts/third-party.py && git diff --exit-code data/third-party.txt
      - name: Check the program runs on Ubuntu 24.04's glibc (2.39) or newer
        run: |
          need=$(objdump -T target/release/depot | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "needs glibc $need"
          [ "$(printf '%s\n2.39\n' "$need" | sort -V | tail -1)" = 2.39 ]
